.catChips button:hover{background:#e0ad6726}
.categorySection{scroll-margin-top:12px}
.ticketHead{display:flex!important;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:0 0 10px;color:var(--cream);background:transparent;border-bottom:1px solid var(--line);margin-bottom:6px;cursor:default;font-size:17px}
.ticketHead small{color:var(--muted);font-weight:600;margin-left:6px}.ticketHead strong{color:#f0ca80}.ticketHead i{display:none;font-style:normal;transition:transform .25s}
.ticketLine{display:grid!important;grid-template-columns:minmax(0,1fr) auto 40px!important;align-items:center;gap:8px}
.ticketLine small.lineSum{display:block!important;margin-top:3px;color:var(--muted);font-size:12px}
.ticketLine .ticketProduct b{white-space:normal!important}
.qty{display:flex;align-items:center;gap:6px}.qty b{min-width:22px;text-align:center;color:var(--cream)}
.qty button{width:36px!important;height:36px;padding:0!important;display:grid!important;place-items:center;text-align:center!important;font-size:20px;line-height:1;border-radius:11px}
.qtyOnly{color:var(--cream)}
.ticketRemove{grid-column:auto!important;grid-row:auto!important;width:40px;height:36px}
.ticketActions{display:grid!important;grid-template-columns:1fr 1fr;gap:7px}.ticketActions .primary{grid-column:1/-1;text-align:center}.ticketActions button{text-align:center}
.closedOrder{grid-template-columns:minmax(0,560px)!important}
@media(max-width:850px){
 .posProducts{padding-bottom:110px}
 .toolbarTotal{display:none}
 .ticket:not(.closedTicket){position:fixed!important;top:auto!important;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:26;padding:0!important;max-height:min(70vh,580px);display:flex;flex-direction:column;box-shadow:0 -12px 34px #000c;border-color:#e0ad6766!important}
 .ticket:not(.closedTicket) .ticketHead{padding:14px 16px;margin:0;border:0;cursor:pointer;background:linear-gradient(120deg,#3b251b,#24150f);border-radius:17px}
 .ticket:not(.closedTicket) .ticketHead i{display:inline}
 .ticket:not(.closedTicket) .ticketBody{display:none;overflow:auto;padding:4px 14px 14px}
 .ticket.open .ticketBody{display:block!important}
 .ticket.open .ticketHead{border-radius:17px 17px 0 0;border-bottom:1px solid var(--line)}
 .ticket.open .ticketHead i{transform:rotate(180deg)}
}
/* Ustawienia */
.adminTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.adminTop h2{margin:0}
.adminClose{width:auto!important;white-space:nowrap}
.adminNav button{display:flex!important;align-items:center;gap:9px;padding:10px 11px!important}
.adminNav .ic{width:22px;text-align:center}
.adminNav em{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--red);color:#fff;font:800 11px system-ui}
#adminPane{min-width:0}
.adminTiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.adminTile{display:flex!important;flex-direction:column;gap:6px;padding:16px!important;border-radius:16px;background:#fff1da09!important;border:1px solid #e0ad672e!important;text-align:left;transition:transform .18s,border-color .18s}
.adminTile:hover{transform:translateY(-2px);border-color:#f0ca8088!important}
.adminTile .ic{font-size:26px}.adminTile b{color:var(--cream);font-size:15px}.adminTile small{color:var(--muted)}
.adminTile.alert{border-color:#ee706577!important;background:#ee70650f!important}.adminTile.alert small{color:#ffb9b1}
.qrSetting{display:flex;align-items:center;justify-content:space-between;gap:12px}.qrSetting h3{margin:0 0 4px}.qrSetting p{margin:0}.qrSetting button{width:auto}
/* Lokal */
.venueKpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}
.venueRoom{margin-bottom:10px}.venueRoom h3{margin:0 0 3px}
.okPill{background:#71c98a22!important;color:#b9f4c8!important}
.tableGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.tableChip{display:flex!important;flex-direction:column;gap:4px;padding:11px!important;border-radius:13px;background:linear-gradient(145deg,#3b251b,#24150f)!important;border:1px solid #e0ad6740!important;text-align:left}
.tableChip b{color:var(--cream)}.tableChip small{color:var(--muted)}.tableChip.off{opacity:.5}
.tableChip:hover{border-color:#f0ca80!important}
/* Zgłoszenia */
.bugMeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff1da08;font-size:12px;color:var(--muted)}
.bugCard{align-items:flex-start}.bugCard.done{opacity:.6}
.bugHead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;margin-bottom:4px}.bugHead span{font-size:12px;color:var(--muted)}
.bugCard small{display:block;margin-top:2px}
.bugText{margin:9px 0 0;white-space:pre-wrap;color:var(--cream)}
.bugImg{display:inline-flex;flex-direction:column;gap:4px;margin-top:10px;color:#f0ca80;font-size:12px;text-decoration:none}
.bugImg img{max-width:220px;max-height:160px;border-radius:10px;border:1px solid #e0ad6744;object-fit:cover;background:#fff1;min-height:60px;min-width:90px}
.bugActions{display:flex;flex-direction:column;gap:6px}.bugActions button{white-space:nowrap;text-align:center}
@media(max-width:700px){.venueKpis{grid-template-columns:1fr 1fr}.bugCard{flex-direction:column}.bugActions{flex-direction:row;width:100%}.bugActions button{flex:1}.quickAdd{grid-template-columns:1fr 1fr!important}.quickAdd .shiftEmployee{grid-column:1/-1}.quickAdd>div:last-child{grid-column:1/-1}.availRow{grid-template-columns:1fr auto}.availRow>span:nth-child(2){grid-column:1;grid-row:2}.availRow button,.availRow .statusPill{grid-row:1/3;grid-column:2}.adminTiles{grid-template-columns:1fr 1fr}.qrSetting{flex-direction:column;align-items:flex-start}}

.bugCard small b{display:inline!important}
#modal .toolbar{display:flex!important;flex-direction:row!important;align-items:flex-start!important;justify-content:space-between;gap:10px}#modal .toolbar h2{margin:4px 0 0;min-width:0}#modal .toolbar>button{width:42px!important;height:42px;flex:0 0 auto;display:grid!important;place-items:center;padding:0!important}
.availRow.today{box-shadow:inset 3px 0 0 #f0ca80}.availRow b small{color:var(--muted);font-weight:600;margin-left:6px}
</style></head>

async function shrinkImage(file,max=1600){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Nie można odczytać zdjęcia'));i.src=url});const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}finally{URL.revokeObjectURL(url)}}

r.id):sb.from('site_news').insert({...p,created_by:state.user.id}));if(z.error){if(f&&image_path)await sb.storage.from('site-news').remove([image_path]);return alert(z.error.message)}if(oldPath&&oldPath!==image_path)await sb.storage.from('site-news').remove([oldPath]);closeModal();await loadAll();newsCenter();toast(p.published?'Aktualność jest na stronie':'Aktualność zapisana jako ukryta')});setTimeout(()=>{if(r){$('#newsTitle').value=r.title||'';$('#newsBody').value=r.body||'';$('#newsDate').value=r.event_date||'';$('#newsPublished').checked=r.published!==false;$('#newsPinned').checked=!!r.pinned}},0)};

/* zapis odporny na brakujące kolumny w bazie (np. place_name w starszej tabeli) */
async function saveRow(table,data,id=null){let p={...data};for(let i=0;i<8;i++){const r=await(id?sb.from(table).update(p).eq('id',id).select():sb.from(table).insert(p).select());if(!r.error)return r;const m=/'([^']+)' column/.exec(r.error.message||'');if((r.error.code==='PGRST204'||/schema cache/.test(r.error.message||''))&&m&&m[1] in p){console.warn(`${table}: brak kolumny ${m[1]} – pomijam`);delete p[m[1]];continue}return r}return{error:{message:'Nie udało się zapisać.'}}}
async function removeRow(table,id){const r=await sb.from(table).delete().eq('id',id).select('id');if(r.error)return r;if(!r.data?.length)return{error:{message:'Baza nie pozwoliła usunąć (brak uprawnień). Uruchom skrypt SQL v3.5.',code:'RLS'}};return r}

 return `<div class="availWrap"><table class="availTable"><thead><tr><th>${canManage()?'Pracownik':'Dzień'}</th>${days.map(ds=>{const d=new Date(ds+'T12:00');return `<th class="${ds===today?'today':''}">${d.toLocaleDateString('pl-PL',{weekday:'short'})}<small>${d.getDate()}.${d.getMonth()+1}</small></th>`}).join('')}</tr></thead><tbody>${rows.map(e=>`<tr><th>${esc(e.full_name)}</th>${days.map(ds=>{const a=canManage()?availFor(e,ds):myAvail(ds);return `<td class="av ${availCls(a)}" onclick="${canManage()?`shiftDay('${ds}')`:`availabilityForm('${ds}')`}">${availText(a)}</td>`}).join('')}</tr>`).join('')||'<tr><td colspan="8" class="muted">Brak pracowników.</td></tr>'}</tbody></table></div><p class="muted hint">${canManage()?'Kliknij dzień, żeby zaplanować zmiany – widać od razu, kto jest dostępny.':'Kliknij dzień, żeby zgłosić lub zmienić swoją dyspozycyjność.'}</p>`}
window.availabilityForm=(ds=iso(new Date()))=>{const a=myAvail(ds),ret=state.dayReturn;modal('Moja dyspozycyjność',`${dayBackBtn()}<div class="formGrid"><div>${field('avDate','Data','date',`value="${ds}" required`)}</div><div><label>Status</label><select id="avStatus" onchange="$('#avTimes').classList.toggle('hide',this.value!=='available')"><option value="available">Dostępny</option><option value="unavailable" ${a?.status==='unavailable'?'selected':''}>Niedostępny</option></select></div></div><div id="avTimes" class="formGrid ${a?.status==='unavailable'?'hide':''}"><div>${field('avFrom','Od','time',`value="${a?.start_time?.slice(0,5)||'14:00'}"`)}</div><div>${field('avTo','Do','time',`value="${a?.end_time?.slice(0,5)||'23:00'}"`)}</div></div>${a?`<button type="button" class="danger" style="margin-top:10px" onclick="deleteAvailability('${a.id}','${ds}')">Usuń wpis</button>`:''}`,async()=>{const e=employee(),ok=$('#avStatus').value==='available',payload={user_id:state.user.id,employee_id:e?.id||null,work_date:$('#avDate').value,start_time:ok?$('#avFrom').value:null,end_time:ok?$('#avTo').value:null,status:$('#avStatus').value};if(!payload.work_date)return alert('Wybierz datę.');const r=await sb.from('availability').upsert(payload,{onConflict:'user_id,work_date'});if(r.error)return alert('Nie udało się zapisać dyspozycyjności: '+r.error.message);await loadAll();refreshPage();if(ret)shiftDay(ret.ds);else closeModal();toast('Dyspozycyjność zapisana')})};

function schedule(){const d=state.week,mode=state.scheduleMode;content().innerHTML=`<div class="toolbar"><div><h2>Grafik</h2><small class="muted">${mode==='week'?'Tydzień':mode==='month'?'Miesiąc':'Dyspozycyjność'} • kliknij dzień, aby go otworzyć</small></div><div class="actions">${canManage()?'<button class="primary" onclick="shiftForm()">+ Dodaj zmianę</button>':'<button class="primary" onclick="availabilityForm()">+ Moja dyspozycyjność</button>'}</div></div><div class="scheduleNext"><span class="muted">Następna zmiana: </span><b>${nextShiftText()}</b></div><div class="navControls"><button class="ghost" onclick="moveSchedule(-1)">‹</button><button class="ghost" onclick="moveSchedule(0)">Dziś</button><button class="ghost" onclick="moveSchedule(1)">›</button></div><div class="mode"><button class="ghost ${mode==='week'?'active':''}" onclick="scheduleMode('week')">Tydzień</button><button class="ghost ${mode==='month'?'active':''}" onclick="scheduleMode('month')">Miesiąc</button><button class="ghost ${mode==='avail'?'active':''}" onclick="scheduleMode('avail')">Dyspozycyjność</button></div>${mode==='week'?weekHtml(d):mode==='month'?monthHtml():availHtml(d)}`}
function shiftHtml(s){return `<div class="shift" onclick="event.stopPropagation();${canManage()?`shiftForm('${s.id}','${s.shift_date}')`:`shiftDay('${s.shift_date}')`}"><b>${esc(employeeName(s.employee_id))}</b><small>${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</small></div>`}
function dayAvailBadge(ds){if(canManage()){const n=state.employees.filter(e=>availFor(e,ds)?.status==='available').length;return n?`<span class="avBadge yes">✓ ${n} dostęp.</span>`:''}const a=myAvail(ds);return a?`<span class="avBadge ${availCls(a)}">${availText(a)}</span>`:''}
function weekHtml(a){const today=iso(new Date());return `<div class="week">${[0,1,2,3,4,5,6].map(i=>{const d=new Date(a);d.setDate(a.getDate()+i);const ds=iso(d),rows=visibleShifts().filter(s=>s.shift_date===ds).sort((x,y)=>x.start_time.localeCompare(y.start_time));return `<section class="day clickDay ${ds===today?'today':''}" onclick="shiftDay('${ds}')"><div class="dayHead"><b>${d.toLocaleDateString('pl-PL',{weekday:'long'})}</b><span class="badge">${d.getDate()}</span></div>${dayAvailBadge(ds)}${rows.map(shiftHtml).join('')||'<p class="muted">Brak zmian</p>'}${canManage()?'<span class="dayPlus">+ dodaj</span>':''}</section>`}).join('')}</div>`}
function monthHtml(){const m=state.month,f=new Date(m.getFullYear(),m.getMonth(),1),s=startWeek(f),today=iso(new Date());let cells='';for(let i=0;i<42;i++){const d=new Date(s);d.setDate(s.getDate()+i);const ds=iso(d),rows=visibleShifts().filter(x=>x.shift_date===ds).sort((x,y)=>x.start_time.localeCompare(y.start_time));cells+=`<section class="day clickDay ${ds===today?'today':''}" style="opacity:${d.getMonth()===m.getMonth()?1:.35}" onclick="shiftDay('${ds}')"><b>${d.getDate()}</b>${rows.slice(0,4).map(x=>`<div class="entry" onclick="event.stopPropagation();${canManage()?`shiftForm('${x.id}','${ds}')`:`shiftDay('${ds}')`}">${esc(employeeName(x.employee_id))} ${x.start_time.slice(0,5)}</div>`).join('')}${rows.length>4?`<div class="moreEntries">+${rows.length-4} więcej</div>`:''}</section>`}return `<div class="monthWrap"><div class="month">${['Pon','Wt','Śr','Czw','Pt','Sob','Nd'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}
window.scheduleMode=m=>{state.scheduleMode=m;schedule()};
window.moveSchedule=n=>{if(!n){state.week=startWeek(new Date());state.month=new Date(new Date().getFullYear(),new Date().getMonth(),1)}else if(state.scheduleMode!=='month')state.week=new Date(state.week.getFullYear(),state.week.getMonth(),state.week.getDate()+n*7);else state.month=new Date(state.month.getFullYear(),state.month.getMonth()+n,1);schedule()};

 if(canManage()){const av=state.employees.map(e=>({e,a:availFor(e,ds),has:rows.some(s=>s.employee_id===e.id)})).sort((x,y)=>(y.a?.status==='available')-(x.a?.status==='available')||x.e.full_name.localeCompare(y.e.full_name,'pl'));
  body+=`<h3 class="dayH">Dodaj pracownika</h3><div class="shiftEditor quickAdd"><div class="shiftEmployee"><label>Pracownik</label><select id="qaEmp">${state.employees.map(e=>`<option value="${e.id}">${esc(e.full_name)}</option>`).join('')}</select></div><div><label>Od</label><input id="qaFrom" type="time" value="14:00"></div><div><label>Do</label><input id="qaTo" type="time" value="22:00"></div><div><button type="button" class="primary" onclick="quickShift('${ds}')">+ Dodaj</button></div></div><h3 class="dayH">Dyspozycyjność tego dnia</h3><div class="availList">${av.map(({e,a,has})=>`<div class="availRow ${availCls(a)}"><b>${esc(e.full_name)}</b><span>${availText(a)}</span>${has?'<span class="statusPill">w grafiku</span>':a?.status!=='unavailable'?`<button type="button" class="ghost" onclick="prefillShift('${e.id}','${(a?.start_time||'').slice(0,5)}','${(a?.end_time||'').slice(0,5)}')">Wybierz</button>`:'<span></span>'}</div>`).join('')||'<p class="muted">Brak pracowników.</p>'}</div>`}
 else{const a=myAvail(ds);body+=`<h3 class="dayH">Moja dyspozycyjność</h3><div class="availRow ${availCls(a)}"><b>${a?(a.status==='available'?'Dostępny':'Niedostępny'):'Nie zgłoszono'}</b><span>${availText(a)}</span><button type="button" class="primary" onclick="availabilityForm('${ds}')">${a?'Zmień':'Zgłoś'}</button></div>`}
 modal(cap(dayLabel(ds)),body,null,false);$('#modal').classList.add('dayModal')};
window.prefillShift=(id,from,to)=>{$('#qaEmp').value=id;if(from)$('#qaFrom').value=from;if(to)$('#qaTo').value=to;$('#qaFrom').focus();$('.quickAdd').classList.add('flash');setTimeout(()=>$('.quickAdd')?.classList.remove('flash'),700)};
window.quickShift=async ds=>{const p={employee_id:$('#qaEmp').value,shift_date:ds,start_time:$('#qaFrom').value,end_time:$('#qaTo').value,created_by:state.user.id};if(!p.employee_id||!p.start_time||!p.end_time)return alert('Wybierz pracownika i godziny.');const same=state.shifts.find(x=>x.employee_id===p.employee_id&&x.shift_date===ds);if(same&&!confirm(`${employeeName(p.employee_id)} ma już zmianę tego dnia (${same.start_time.slice(0,5)}–${same.end_time.slice(0,5)}). Dodać kolejną?`))return;const z=await saveRow('work_shifts',p);if(z.error)return alert(z.error.code==='23505'?'Baza pozwala tylko na jedną zmianę dziennie dla pracownika. Usuń ograniczenie unikalne (employee_id, shift_date) w tabeli work_shifts.':'Nie udało się dodać zmiany: '+z.error.message);await loadAll();schedule();shiftDay(ds);toast(`Dodano: ${employeeName(p.employee_id)} ${p.start_time}–${p.end_time}`)};
window.shiftForm=(id=null,ds=null)=>{const r=state.shifts.find(x=>x.id===id),ret=state.dayReturn;modal(r?'Edytuj zmianę':'Nowa zmiana',`${dayBackBtn()}<div class="shiftEditor"><div class="shiftEmployee"><label>Pracownik</label><select id="shiftEmployee">${state.employees.map(e=>`<option value="${e.id}" ${e.id===r?.employee_id?'selected':''}>${esc(e.full_name)}</option>`).join('')}</select></div><div>${field('shiftDate','Data','date',`value="${r?.shift_date||ds||iso(new Date())}" required`)}</div><div>${field('shiftStart','Od','time',`value="${r?.start_time?.slice(0,5)||'14:00'}" required`)}</div><div>${field('shiftEnd','Do','time',`value="${r?.end_time?.slice(0,5)||'22:00'}" required`)}</div></div><div class="shiftModalActions">${r?`<button type="button" class="danger" onclick="deleteShift('${r.id}','${r.shift_date}')">Usuń zmianę</button>`:'<span></span>'}<button type="submit" class="primary">Zapisz</button></div>`,async()=>{const p={employee_id:$('#shiftEmployee').value,shift_date:$('#shiftDate').value,start_time:$('#shiftStart').value,end_time:$('#shiftEnd').value,created_by:state.user.id},same=state.shifts.find(x=>x.id!==r?.id&&x.employee_id===p.employee_id&&x.shift_date===p.shift_date);if(same&&!confirm(`${employeeName(p.employee_id)} ma już zmianę tego dnia (${same.start_time.slice(0,5)}–${same.end_time.slice(0,5)}). Dodać kolejną?`))return;const z=await saveRow('work_shifts',p,r?.id);if(z.error)return alert(z.error.code==='23505'?'Baza pozwala tylko na jedną zmianę dziennie dla pracownika. Usuń ograniczenie unikalne (employee_id, shift_date) w tabeli work_shifts.':z.error.message);await loadAll();schedule();if(ret)shiftDay(p.shift_date);else closeModal();toast('Grafik zapisany')},false);$('#modal').classList.add('shiftModalCompact')};

/* ---------------- REZERWACJE ---------------- */
function bookingCard(b){const pending=bookingStatus(b)==='pending',t=new Date(b.start_at),click=canManage()?`role="button" tabindex="0" onclick="event.stopPropagation();bookingForm('${b.id}')"`:'';return `<div class="card bookingCard ${canManage()?'':'readonly'}" ${click}><div class="grow"><b>${t.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} • ${esc(b.title)}</b><small>${b.guests_count||0} os. • ${esc(placeName(b))}${b.table_label?` • ${esc(b.table_label)}`:''}</small>${b.source==='www'?'<span class="wwwBadge">🌐 Ze strony www</span>':''}${pending?'<span class="pendingBadge">Oczekuje na zatwierdzenie</span>':''}${b.notes?`<small class="bookNotes">${esc(b.notes)}</small>`:''}${canManage()&&pending?`<div class="approvalActions"><button type="button" class="ok" onclick="event.stopPropagation();approveBooking('${b.id}')">Zatwierdź</button><button type="button" class="danger" onclick="event.stopPropagation();rejectBooking('${b.id}')">Odrzuć</button></div>`:''}</div></div>`}

function bookings(){const w=state.bookingWeek,m=state.bookingMonth;content().innerHTML=`<div class="toolbar"><div><h2>Rezerwacje</h2><small class="muted">${state.bookingMode==='week'?`Tydzień od ${w.toLocaleDateString('pl-PL')}`:cap(m.toLocaleDateString('pl-PL',{month:'long',year:'numeric'}))} • kliknij dzień, aby go otworzyć</small></div><button class="primary" onclick="bookingForm()">+ Rezerwacja</button></div><div class="navControls"><button class="ghost" onclick="moveBookings(-1)">‹</button><button class="ghost" onclick="moveBookings(0)">Dziś</button><button class="ghost" onclick="moveBookings(1)">›</button></div><div class="mode"><button class="ghost ${state.bookingMode==='week'?'active':''}" onclick="bookingMode('week')">Tydzień</button><button class="ghost ${state.bookingMode==='month'?'active':''}" onclick="bookingMode('month')">Miesiąc</button></div>${state.bookingMode==='week'?bookingWeekHtml(w):bookingMonthHtml(m)}`}
function bookingWeekHtml(w){const today=iso(new Date());return `<div class="cards">${[0,1,2,3,4,5,6].map(i=>{const d=new Date(w);d.setDate(w.getDate()+i);const ds=iso(d),rows=dayBookings(ds),g=rows.reduce((n,b)=>n+Number(b.guests_count||0),0);return `<section class="bookingDay clickDay ${ds===today?'today':''}" onclick="bookingDay('${ds}')"><div class="dayHead"><b>${d.toLocaleDateString('pl-PL',{weekday:'long'})} <small class="muted">${d.getDate()}.${d.getMonth()+1}</small></b><span class="dayMeta">${rows.length?`${rows.length} rez. • ${g} os.`:''}<button type="button" class="ghost dayAddBtn" onclick="event.stopPropagation();bookingForm(null,'${ds}')" aria-label="Dodaj rezerwację">+</button></span></div>${rows.map(bookingCard).join('')||'<p class="muted">Brak rezerwacji</p>'}</section>`}).join('')}</div>`}
function bookingMonthHtml(m){const first=new Date(m.getFullYear(),m.getMonth(),1),start=startWeek(first),today=iso(new Date());let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d),rows=dayBookings(ds);cells+=`<section class="day clickDay ${ds===today?'today':''}" style="opacity:${d.getMonth()===m.getMonth()?1:.35}" onclick="bookingDay('${ds}')"><b>${d.getDate()}</b>${rows.slice(0,3).map(b=>`<div class="bookingMonthEntry ${bookingStatus(b)==='pending'?'pending':''}" onclick="event.stopPropagation();${canManage()?`bookingForm('${b.id}')`:`bookingDay('${ds}')`}">${new Date(b.start_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} ${esc(b.title)}</div>`).join('')}${rows.length>3?`<div class="moreEntries">+${rows.length-3} więcej</div>`:''}</section>`}return `<div class="monthWrap"><div class="bookingMonth">${['Pon','Wt','Śr','Czw','Pt','Sob','Nd'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}
window.bookingDay=ds=>{state.dayReturn={type:'booking',ds};const rows=dayBookings(ds),g=rows.reduce((n,b)=>n+Number(b.guests_count||0),0),pend=rows.filter(b=>bookingStatus(b)==='pending').length,byPlace={};rows.forEach(b=>{const k=placeName(b);byPlace[k]=(byPlace[k]||0)+Number(b.guests_count||0)});modal(cap(dayLabel(ds)),`<div class="dayStats"><span>${rows.length} ${rows.length===1?'rezerwacja':rows.length>1&&rows.length<5?'rezerwacje':'rezerwacji'}</span><span>${g} gości</span>${pend?`<span class="pendingBadge">${pend} do zatwierdzenia</span>`:''}</div>${Object.keys(byPlace).length?`<div class="placeLoad">${Object.entries(byPlace).map(([k,v])=>{const p=state.places.find(x=>x.name===k),c=Number(p?.capacity||0);return `<span>${esc(k)}: <b>${v}${c?` / ${c}`:''}</b> os.</span>`}).join('')}</div>`:''}<div class="cards">${rows.map(bookingCard).join('')||'<div class="empty">Brak rezerwacji tego dnia.</div>'}</div><button type="button" class="primary dayAdd" onclick="bookingForm(null,'${ds}')">+ Rezerwacja na ten dzień</button>`,null,false);$('#modal').classList.add('dayModal')};

function bugNo(b){return [...state.bugs].sort((x,y)=>String(x.created_at).localeCompare(String(y.created_at))).indexOf(b)+1}
function screenName(){const h=($('#adminPane h2')||$('#content h2'))?.textContent?.trim();return h||$('[data-view].active small')?.textContent||'Start'}
function deviceName(){const u=navigator.userAgent,os=/iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Inny system',br=/Edg\//.test(u)?'Edge':/CriOS|Chrome\//.test(u)?'Chrome':/FxiOS|Firefox/.test(u)?'Firefox':/Safari/.test(u)?'Safari':'przeglądarka';return `${os} • ${br} • ${innerWidth}×${innerHeight}`}
window.bugImagePreview=input=>{const f=input.files?.[0],box=$('#bugImgBox');if(box)box.innerHTML=f?`<img class="newsPreviewImg" src="${URL.createObjectURL(f)}" alt="">`:''};
window.bugForm=()=>{const page=screenName();modal('🐞 Zgłoś błąd',`<p class="muted">Opisz, co nie działa. Możesz dodać zrzut ekranu albo zdjęcie.</p><label>Co się stało?</label><textarea id="bugText" required maxlength="3000" placeholder="np. Po kliknięciu „Zapisz” w rezerwacji pojawia się komunikat…"></textarea><label>Zdjęcie / zrzut ekranu (opcjonalnie)</label><input id="bugImage" type="file" accept="image/*" onchange="bugImagePreview(this)"><div id="bugImgBox"></div><div class="bugMeta"><span>👤 ${esc(state.profile?.full_name||state.user?.email||'')}</span><span>🕒 ${new Date().toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}</span><span>📍 ${esc(page)}</span></div>`,async()=>{const text=$('#bugText').value.trim();if(text.length<3)return alert('Opisz krótko, co nie działa.');const f=$('#bugImage').files?.[0];let image_path=null;if(f){let blob;try{blob=await shrinkImage(f,1800)}catch(e){return alert(e.message)}const path=`${state.user.id}/${Date.now()}.jpg`,up=await sb.storage.from('bug-reports').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(up.error)return alert('Nie udało się wysłać zdjęcia: '+up.error.message+'\n\nMożesz usunąć zdjęcie i wysłać samo zgłoszenie.');image_path=path}const z=await saveRow('bug_reports',{description:text,title:text.slice(0,80),image_path,reporter_id:state.user.id,user_id:state.user.id,created_by:state.user.id,reporter_name:state.profile?.full_name||null,reporter_email:state.user.email||null,page,user_agent:deviceName(),status:'new'});if(z.error){if(image_path)await sb.storage.from('bug-reports').remove([image_path]);return alert('Nie udało się wysłać zgłoszenia: '+z.error.message)}closeModal();state.bugs=await safe('bug_reports',q=>q.select('*').order('created_at',{ascending:false}).limit(300));if(state.inAdmin&&state.adminTab==='bugs')admin('bugs');toast('Dziękujemy! Zgłoszenie wysłane')})};
function bugCard(b){const w=bugWho(b),d=new Date(b.created_at),done=bugStatus(b)==='done';return `<div class="card bugCard ${done?'done':''}"><div class="grow"><div class="bugHead"><b>#${bugNo(b)} ${done?'✅ Naprawione':'🆕 Nowe'}</b><span>🕒 ${d.toLocaleDateString('pl-PL')} • ${d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}</span></div><small>👤 <b>${esc(w.name)}</b>${w.email?` • ${esc(w.email)}`:''}</small><small>${b.page?`📍 ${esc(b.page)}`:''}${b.user_agent?` • 📱 ${esc(b.user_agent)}`:''}</small><p class="bugText">${esc(bugText(b))}</p>${b.image_path?`<a class="bugImg" data-path="${esc(b.image_path)}" target="_blank" rel="noopener"><img alt="Zdjęcie do zgłoszenia"><span>🔍 Otwórz zdjęcie</span></a>`:''}</div><div class="bugActions"><button class="${done?'ghost':'ok'}" onclick="toggleBug('${b.id}',${!done})">${done?'Otwórz ponownie':'✓ Naprawione'}</button><button class="danger" onclick="deleteBug('${b.id}')">Usuń</button></div></div>`}
async function loadBugImages(){const els=$$('.bugImg[data-path]');if(!els.length)return;const r=await sb.storage.from('bug-reports').createSignedUrls(els.map(e=>e.dataset.path),3600);(r.data||[]).forEach((x,i)=>{if(x?.signedUrl&&els[i]){els[i].href=x.signedUrl;els[i].querySelector('img').src=x.signedUrl}})}
window.setBugFilter=f=>{state.bugFilter=f;bugsAdmin()};
function bugsAdmin(){if(!isAdmin())return home();const f=state.bugFilter||'open',rows=state.bugs.filter(b=>f==='all'||bugStatus(b)!=='done'),open=state.bugs.filter(b=>bugStatus(b)!=='done').length;content().innerHTML=`<div class="toolbar"><div><h2>Zgłoszenia błędów</h2><small class="muted">${open} otwartych • ${state.bugs.length} wszystkich</small></div><div class="actions"><button class="ghost" onclick="bugForm()">+ Zgłoś</button><button class="primary" onclick="downloadBugs()">⬇ Pobierz TXT</button></div></div><div class="mode"><button class="ghost ${f==='open'?'active':''}" onclick="setBugFilter('open')">Otwarte (${open})</button><button class="ghost ${f==='all'?'active':''}" onclick="setBugFilter('all')">Wszystkie (${state.bugs.length})</button></div><div class="cards">${rows.map(bugCard).join('')||'<div class="empty">Brak zgłoszeń 🎉</div>'}</div>`;loadBugImages()}
window.bugsAdmin=bugsAdmin;
window.toggleBug=async(id,done)=>{const r=await saveRow('bug_reports',{status:done?'done':'new',resolved_at:done?new Date().toISOString():null},id);if(r.error)return alert(r.error.message);await loadAll();admin('bugs');toast(done?'Oznaczono jako naprawione':'Zgłoszenie otwarte ponownie')};
window.deleteBug=async id=>{const b=state.bugs.find(x=>x.id===id);if(!b||!confirm(`Usunąć zgłoszenie #${bugNo(b)}?`))return;const r=await removeRow('bug_reports',id);if(r.error)return alert(r.error.message);if(b.image_path)await sb.storage.from('bug-reports').remove([b.image_path]);await loadAll();admin('bugs');toast('Zgłoszenie usunięte')};
window.downloadBugs=async()=>{const rows=[...state.bugs].sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));if(!rows.length)return alert('Brak zgłoszeń do pobrania.');const paths=rows.filter(b=>b.image_path).map(b=>b.image_path),links={};if(paths.length){const r=await sb.storage.from('bug-reports').createSignedUrls(paths,604800);(r.data||[]).forEach((x,i)=>{if(x?.signedUrl)links[paths[i]]=x.signedUrl})}const now=new Date(),hr='-'.repeat(56);let t=`ZGŁOSZENIA BŁĘDÓW – Cafe Strych Manager\nWygenerowano: ${now.toLocaleString('pl-PL')}\nLiczba zgłoszeń: ${rows.length} (otwarte: ${rows.filter(b=>bugStatus(b)!=='done').length})\n${'='.repeat(56)}\n\n`;rows.forEach(b=>{const w=bugWho(b),d=new Date(b.created_at);t+=`#${bugNo(b)} • ${bugStatus(b)==='done'?'NAPRAWIONE':'NOWE'}\nData:        ${d.toLocaleDateString('pl-PL')}\nGodzina:     ${d.toLocaleTimeString('pl-PL')}\nZgłosił(a):  ${w.name}${w.email?` <${w.email}>`:''}\n${b.page?`Ekran:       ${b.page}\n`:''}${b.user_agent?`Urządzenie:  ${b.user_agent}\n`:''}Opis:\n${bugText(b).split('\n').map(x=>'  '+x).join('\n')}\n${b.image_path?`Zdjęcie:     ${links[b.image_path]||'(brak dostępu do zdjęcia)'}${links[b.image_path]?'\n             (link ważny 7 dni)':''}\n`:''}${hr}\n\n`});const blob=new Blob(['﻿'+t.replace(/\n/g,'\r\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zgloszenia-bledow-${iso(now)}.txt`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Pobrano plik TXT')};

/* ---------------- USTAWIENIA (ADMIN) ---------------- */
const ADMIN_TABS=[['overview','🏠','Przegląd'],['accounts','🔐','Konta i role'],['employees','👥','Pracownicy'],['venue','🏛️','Lokal'],['menu','🍽️','Menu POS'],['news','📰','Aktualności www'],['messages','📣','Ogłoszenia'],['bugs','🐞','Zgłoszenia błędów'],['system','🛠️','System i logi']];
function admin(tab='overview'){if(!isAdmin())return home();state.inAdmin=true;state.adminTab=tab;$$('[data-view]').forEach(b=>b.classList.remove('active'));const nb=state.bugs.filter(b=>bugStatus(b)!=='done').length;$('#content').innerHTML=`<div class="adminTop"><div><h2>⚙️ Ustawienia</h2><small class="muted">Panel administratora • wszystko w jednym oknie</small></div><button class="ghost adminClose" onclick="closeAdmin()">✕ Zamknij</button></div><div class="adminShell"><aside class="adminNav">${ADMIN_TABS.map(([k,ic,l])=>`<button class="${tab===k?'active':''}" onclick="admin('${k}')"><span class="ic">${ic}</span><span>${l}</span>${k==='bugs'&&nb?`<em>${nb}</em>`:''}</button>`).join('')}</aside><section id="adminPane"></section></div>`;const pane=$('#adminPane');({overview:()=>adminOverview(pane),accounts:()=>accountsAdmin(pane),employees:()=>employeesView(),venue:()=>venueAdmin(),menu:()=>menuAdmin(),news:()=>newsCenter(),messages:()=>messagesAdmin(pane),bugs:()=>bugsAdmin(),system:()=>systemAdmin(pane)}[tab]||(()=>adminOverview(pane)))();state.page=()=>admin(tab);$('.adminNav .active')?.scrollIntoView({block:'nearest',inline:'center'})}
window.closeAdmin=()=>{state.inAdmin=false;view('home')};
function adminOverview(p){const nb=state.bugs.filter(b=>bugStatus(b)!=='done').length,st={accounts:`${state.profiles.length} kont • ${state.profiles.filter(x=>x.active===false).length} zablok.`,employees:`${state.employees.length} aktywnych`,venue:`${state.rooms.length} sal • ${state.tables.length} stolików • ${state.places.length} miejsc`,menu:`${state.menu.filter(x=>x.active!==false).length} produktów`,news:`${state.news.filter(n=>n.published).length} na stronie`,messages:`${state.announcements.length} ogłoszeń`,bugs:nb?`${nb} do sprawdzenia`:'brak nowych',system:'Wersja i aktywność'};p.innerHTML=`<div class="adminTiles">${ADMIN_TABS.slice(1).map(([k,ic,l])=>`<button class="adminTile ${k==='bugs'&&nb?'alert':''}" onclick="admin('${k}')"><span class="ic">${ic}</span><b>${l}</b><small>${st[k]}</small></button>`).join('')}</div><section class="setting qrSetting"><div><h3>Zamawianie QR</h3><p>Funkcja jest <b>${state.settings.qr_enabled?'WŁĄCZONA':'WYŁĄCZONA'}</b>.</p></div><button class="${state.settings.qr_enabled?'danger':'primary'}" onclick="toggleQR()">${state.settings.qr_enabled?'Wyłącz':'Włącz'}</button></section>`}
function systemAdmin(p){p.innerHTML=`<div class="toolbar"><h2>System i logi</h2></div><div class="grid two"><section class="panel"><h3>Stan aplikacji</h3><p>Cafe Strych Manager <b>V3.5</b> • 16.10.2026</p><p>Profile: ${state.profiles.length}<br>Pracownicy: ${state.employees.length}<br>Produkty w menu: ${state.menu.length}<br>Zgłoszenia błędów: ${state.bugs.length} (otwarte: ${state.bugs.filter(b=>bugStatus(b)!=='done').length})</p></section><section class="panel"><h3>Aktywność</h3>${state.logs.slice(0,50).map(x=>`<div class="card"><div><b>${esc(x.action)}</b><small>${esc(x.user_email||'Użytkownik')} • ${new Date(x.created_at).toLocaleString('pl-PL')}</small></div></div>`).join('')||'<p class="muted">Brak logów.</p>'}</section></div>`}

/* ---------------- START PRACOWNIKA ---------------- */
function employeeHome(){const e=employee(),mine=state.shifts.filter(s=>s.employee_id===e?.id),future=mine.filter(s=>s.shift_date>=iso(new Date())).sort((a,b)=>a.shift_date.localeCompare(b.shift_date)),m=new Date(),a=iso(new Date(m.getFullYear(),m.getMonth(),1)),z=iso(new Date(m.getFullYear(),m.getMonth()+1,0)),h=mine.filter(s=>s.shift_date>=a&&s.shift_date<=z).reduce((n,s)=>n+hours(s),0),goAvail=allowed('schedule')?"state.scheduleMode='avail';view('schedule')":'availabilityForm()';content().innerHTML=`<div class="toolbar"><div><h2>Cześć, ${esc(state.profile?.full_name||'')}</h2><small class="muted">Panel pracownika</small></div><button class="ghost" onclick="${goAvail}">📅 Moja dyspozycyjność</button></div><div class="grid two"><section class="panel"><h3>Najbliższa zmiana</h3>${future[0]?`<strong>${future[0].shift_date}</strong><p>${future[0].start_time.slice(0,5)}–${future[0].end_time.slice(0,5)}</p>`:'<p class="muted">Brak zaplanowanej zmiany.</p>'}</section><section class="panel"><h3>Godziny w miesiącu</h3><strong class="total">${fmtH(h)}</strong></section><section class="panel full"><h3>Komunikaty</h3>${employeeMessages().map(a=>employeeMessageCard(a)).join('')||'<p class="muted">Brak komunikatów.</p>'}</section></div>`}

['newsCenter','employeesView','messagesCenter','posConfiguration','menuAdmin','roomsAdmin','placesAdmin','myAccount','salesReport','orderHistory','admin','employeeDocuments','venueAdmin','bugsAdmin'].forEach(n=>{const f=window[n];if(typeof f!=='function')return;window[n]=(...a)=>{$$('[data-view]').forEach(b=>b.classList.remove('active'));state.page=()=>f(...a);return f(...a)}});['home','pos','schedule','bookings','shopping','openOrder'].forEach(n=>{const f=window[n];if(typeof f!=='function')return;window[n]=(...a)=>{state.page=null;state.inAdmin=false;return f(...a)}});
let reloadTimer;function live(){clearTimeout(reloadTimer);reloadTimer=setTimeout(async()=>{await loadAll();refreshNext();const ae=document.activeElement,typing=ae&&ae.closest('#content')&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);if($('#modal').open||typing){state.pendingRefresh=true;return}state.pendingRefresh=false;const og=$('#menuGrid')?.dataset.order;if(og&&state.orders.some(o=>o.id===og))return rerenderOrder(og);if(state.page)return state.page();view($('[data-view].active')?.dataset.view||'home')},250)};['employees','work_shifts','bookings','shopping','profiles','pos_orders','pos_order_items','pos_payments','availability','announcements','message_reads','employee_documents','menu_items','cafe_tables','cafe_rooms','reservation_places','site_news','bug_reports'].forEach(t=>sb.channel('cs-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},live).subscribe());
$('#modal').addEventListener('close',()=>{state.dayReturn=null;if(state.pendingRefresh){state.pendingRefresh=false;live()}});
sb.auth.onAuthStateChange((e,s)=>setTimeout(()=>{boot(s);if(e==='PASSWORD_RECOVERY')setTimeout(()=>changePassword(true),400)},0));sb.auth.getSession().then(({data})=>boot(data.session));
</script></body></html>
