async function shrinkImage(file,max=1600){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Nie można odczytać zdjęcia'));i.src=url});const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}finally{URL.revokeObjectURL(url)}}

r.id):sb.from('site_news').insert({...p,created_by:state.user.id}));if(z.error){if(f&&image_path)await sb.storage.from('site-news').remove([image_path]);return alert(z.error.message)}if(oldPath&&oldPath!==image_path)await sb.storage.from('site-news').remove([oldPath]);closeModal();await loadAll();newsCenter();toast(p.published?'Aktualność jest na stronie':'Aktualność zapisana jako ukryta')});setTimeout(()=>{if(r){$('#newsTitle').value=r.title||'';$('#newsBody').value=r.body||'';$('#newsDate').value=r.event_date||'';$('#newsPublished').checked=r.published!==false;$('#newsPinned').checked=!!r.pinned}},0)};

const content=()=>(state.inAdmin&&$('#adminPane'))||$('#content');
const cap=s=>String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1);
const dayLabel=ds=>new Date(ds+'T12:00').toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
const fmtH=h=>`${Number(h||0).toFixed(2).replace('.',',').replace(/,00$/,'')} h`;

function refreshPage(){if(state.page)return state.page();const v=$('[data-view].active')?.dataset.view;if(v)view(v)}
function dbHint(e){const m=e?.message||String(e||''),t=/Could not find the table '(?:public\.)?([^']+)'/.exec(m);return t?`W bazie danych brakuje tabeli „${t[1]}”.\n\nAdministrator musi uruchomić w Supabase skrypt supabase_v3_5_1.sql (naprawa tabel) – szczegóły w Ustawienia → System i logi.`:m}
const DB_TABLES=['profiles','employees','work_shifts','bookings','shopping','reservation_places','cafe_rooms','cafe_tables','menu_items','pos_orders','pos_order_items','pos_payments','employee_permissions','availability','message_reads','employee_documents','announcements','activity_logs','bug_reports','cafe_settings','site_news'];
async function dbCheck(){state.dbStatus=await Promise.all(DB_TABLES.map(async t=>{try{const r=await sb.from(t).select('*',{count:'exact',head:true});return{t,ok:!r.error,count:r.count,err:r.error?.message||''}}catch(e){return{t,ok:false,err:e.message}}}));return state.dbStatus}
function dbMissingHtml(rows){const miss=rows.filter(x=>!x.ok);return miss.length?`<div class="dbAlert">⚠️ <b>Baza danych wymaga naprawy</b> – brakuje lub nie działa: ${miss.map(x=>`<code>${esc(x.t)}</code>`).join(' ')}.<br>Uruchom w Supabase (SQL Editor) skrypt <b>supabase_v3_5_1.sql</b>, potem odśwież aplikację.</div>`:''}
window.runDbCheck=async()=>{const box=$('#dbStatus');if(box)box.innerHTML='<p class="muted">Sprawdzam tabele…</p>';const rows=await dbCheck();if(!$('#dbStatus'))return;$('#dbStatus').innerHTML=`${dbMissingHtml(rows)}<div class="dbGrid">${rows.map(x=>`<span class="dbChip ${x.ok?'ok':'bad'}" title="${esc(x.err)}">${x.ok?'✓':'✗'} ${esc(x.t)}${x.ok&&x.count!=null?` <small>${x.count}</small>`:''}</span>`).join('')}</div>${rows.every(x=>x.ok)?'<p class="muted">Wszystkie tabele są na miejscu.</p>':''}`};
/* zapis odporny na brakujące kolumny w bazie (np. place_name w starszej tabeli) */
async function saveRow(table,data,id=null){let p={...data};for(let i=0;i<8;i++){const r=await(id?sb.from(table).update(p).eq('id',id).select():sb.from(table).insert(p).select());if(!r.error)return r;const m=/'([^']+)' column/.exec(r.error.message||'');if((r.error.code==='PGRST204'||/column/.test(r.error.message||''))&&m&&m[1] in p){console.warn(`${table}: brak kolumny ${m[1]} – pomijam`);delete p[m[1]];continue}return{...r,error:{...r.error,message:dbHint(r.error)}}}return{error:{message:'Nie udało się zapisać.'}}}
async function removeRow(table,id){const r=await sb.from(table).delete().eq('id',id).select('id');if(r.error)return r;if(!r.data?.length)return{error:{message:'Baza nie pozwoliła usunąć (brak uprawnień). Uruchom skrypt SQL v3.5.',code:'RLS'}};return r}

function isCancelled(o){return o?.status==='cancelled'}
function personName(uid){return state.profiles.find(p=>p.id===uid)?.full_name||''}
function closedOrderInfo(o){const when=o.cancelled_at||o.closed_at;if(isCancelled(o))return `<div class="closedNote cancelled"><b>Rachunek anulowany</b>${when?` • ${new Date(when).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}`:''}${o.cancelled_by&&personName(o.cancelled_by)?` • ${esc(personName(o.cancelled_by))}`:''}${o.cancel_reason?`<br>Powód: ${esc(o.cancel_reason)}`:''}<br>Nie jest liczony do utargu.</div>`;return `<div class="closedNote"><b>Rachunek opłacony</b>${when?` • ${new Date(when).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}`:''}</div>${isAdmin()?`<button class="danger ticketCancel" onclick="cancelOrder('${o.id}')">Anuluj opłacony rachunek</button>`:''}`}
window.cancelOrder=id=>{const o=state.orders.find(x=>x.id===id);if(!o)return;if(isCancelled(o))return alert('Ten rachunek jest już anulowany.');const paid=o.status==='paid';if(paid&&!isAdmin())return alert('Opłacony rachunek może anulować tylko administrator.');if(!paid&&!canManage())return alert('Rachunek może anulować kierownik lub administrator.');
 modal('Anuluj rachunek',`<p class="muted">${paid?'Rachunek jest opłacony. Po anulowaniu zostanie w historii z dopiskiem <b>ANULOWANY</b>, a jego kwota nie będzie liczona do utargu. Tej operacji nie można cofnąć.':'Rachunek zostanie zamknięty jako anulowany i zostanie w historii.'}</p><div class="cancelInfo"><b>${esc(o.customer_name||state.tables.find(t=>t.id===o.table_id)?.label||o.order_no||'Rachunek')}</b><span>${money(orderTotal(id))}</span></div><label>Powód anulowania</label><textarea id="cancelReason" required maxlength="300" placeholder="np. pomyłka przy nabijaniu, zwrot dla gościa…"></textarea>`,async()=>{const reason=$('#cancelReason').value.trim();if(reason.length<3)return alert('Wpisz powód anulowania.');const r=await saveRow('pos_orders',{status:'cancelled',cancel_reason:reason,cancelled_at:new Date().toISOString(),cancelled_by:state.user.id,updated_at:new Date().toISOString()},id);if(r.error)return alert('Nie udało się anulować rachunku:\n'+r.error.message);if(!r.data?.length)return alert('Brak uprawnień do anulowania tego rachunku.');closeModal();await loadAll();if(state.page)state.page();else if($('#menuGrid')||$('.ticket'))openOrder(id);else orderHistory();toast('Rachunek anulowany')})};
window.deleteHistoricalOrder=id=>cancelOrder(id);
window.orderHistory=(f=state.histFilter||'all')=>{state.histFilter=f;const rows=state.orders.filter(o=>f==='all'?['paid','cancelled'].includes(o.status):o.status===f).sort((a,b)=>String(b.closed_at||b.created_at).localeCompare(String(a.closed_at||a.created_at)));content().innerHTML=`<div class="toolbar"><div>${state.inAdmin?'':'<button class="ghost" onclick="pos()">← POS</button>'}<h2>Historia rachunków</h2><small class="muted">Opłaconych rachunków się nie usuwa – administrator może je anulować z podaniem powodu</small></div></div><div class="mode">${[['all','Wszystkie'],['paid','Opłacone'],['cancelled','Anulowane']].map(([k,l])=>`<button class="ghost ${f===k?'active':''}" onclick="orderHistory('${k}')">${l}</button>`).join('')}</div><div class="orderGrid">${rows.map(o=>{const c=isCancelled(o);return `<div class="order historyOrder ${c?'cancelledOrder':''}"><button class="historyOrderContent" onclick="openOrder('${o.id}')"><b>${esc(o.customer_name||state.tables.find(t=>t.id===o.table_id)?.label||o.order_no||'Rachunek')}</b><small>${new Date(o.cancelled_at||o.closed_at||o.created_at).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}</small>${c?`<span class="cancelPill" title="${esc(o.cancel_reason||'')}">ANULOWANY${o.cancel_reason?' • '+esc(o.cancel_reason):''}</span>`:''}<strong>${money(orderTotal(o.id))}</strong></button>${!c&&isAdmin()?`<button class="danger historyDelete" onclick="cancelOrder('${o.id}')">Anuluj</button>`:''}</div>`}).join('')||'<div class="empty">Brak rachunków.</div>'}</div>`};
window.salesReport=(date=iso(new Date()))=>{if(!canManage())return;const cancelledIds=new Set(state.orders.filter(isCancelled).map(o=>o.id)),all=state.payments.filter(p=>day(p.created_at)===date),payments=all.filter(p=>!cancelledIds.has(p.order_id)),canc=all.filter(p=>cancelledIds.has(p.order_id)),sum=l=>l.reduce((n,p)=>n+Number(p.amount||0),0),method=m=>sum(payments.filter(p=>p.method===m)),label=m=>({card:'Karta',cash:'Gotówka',blik:'BLIK',transfer:'Przelew'}[m]||m);content().innerHTML=`<div class="toolbar"><div><button class="ghost" onclick="pos()">← POS</button><h2>Utarg dzienny</h2></div><div><label>Wybierz dzień</label><input type="date" value="${date}" onchange="salesReport(this.value)"></div></div><div class="salesKpis"><div class="kpi"><span>Razem</span><strong>${money(sum(payments))}</strong><small>${payments.length} płatności${canc.length?` • bez ${canc.length} anulowanych (${money(sum(canc))})`:''}</small></div><div class="kpi"><span>Karta</span><strong>${money(method('card'))}</strong></div><div class="kpi"><span>Gotówka</span><strong>${money(method('cash'))}</strong></div><div class="kpi"><span>BLIK</span><strong>${money(method('blik'))}</strong></div><div class="kpi"><span>Przelew</span><strong>${money(method('transfer'))}</strong></div></div><section class="panel"><h3>Płatności z wybranego dnia</h3><div class="salesTable">${all.map(p=>{const o=state.orders.find(x=>x.id===p.order_id),c=cancelledIds.has(p.order_id);return `<div class="salesRow ${c?'cancelled':''}"><div><b>${esc(o?.customer_name||o?.order_no||'Rachunek')}${c?' <span class="cancelPill">ANULOWANY</span>':''}</b><small class="muted">${new Date(p.created_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} • ${esc(label(p.method))}${c&&o?.cancel_reason?` • ${esc(o.cancel_reason)}`:''}</small></div><strong>${money(p.amount)}</strong></div>`}).join('')||'<div class="empty">Brak płatności w tym dniu.</div>'}</div></section>`};
['newsCenter','employeesView','messagesCenter','posConfiguration','menuAdmin','roomsAdmin','placesAdmin','myAccount','salesReport','orderHistory','admin','employeeDocuments','venueAdmin','bugsAdmin','notificationsView'].forEach(n=>{const f=window[n];if(typeof f!=='function')return;window[n]=(...a)=>{$$('[data-view]').forEach(b=>b.classList.remove('active'));state.page=()=>f(...a);return f(...a)}});['home','pos','schedule','bookings','shopping','openOrder'].forEach(n=>{const f=window[n];if(typeof f!=='function')return;window[n]=(...a)=>{state.page=null;state.inAdmin=false;return f(...a)}});
let reloadTimer;function live(){clearTimeout(reloadTimer);reloadTimer=setTimeout(async()=>{await loadAll();refreshNext();const ae=document.activeElement,typing=ae&&ae.closest('#content')&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);if($('#modal').open||typing){state.pendingRefresh=true;return}state.pendingRefresh=false;const og=$('#menuGrid')?.dataset.order;if(og&&state.orders.some(o=>o.id===og))return rerenderOrder(og);if(state.page)return state.page();view($('[data-view].active')?.dataset.view||'home')},250)};['employees','work_shifts','bookings','shopping','profiles','pos_orders','pos_order_items','pos_payments','availability','announcements','message_reads','employee_documents','menu_items','cafe_tables','cafe_rooms','reservation_places','site_news','bug_reports'].forEach(t=>sb.channel('cs-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},live).subscribe());
$('#modal').addEventListener('close',()=>{state.dayReturn=null;if(state.pendingRefresh){state.pendingRefresh=false;live()}});
sb.auth.onAuthStateChange((e,s)=>setTimeout(()=>{boot(s);if(e==='PASSWORD_RECOVERY')setTimeout(()=>changePassword(true),400)},0));sb.auth.getSession().then(({data})=>boot(data.session));
</script></body></html>
