# Cafe Strych – wgrywanie strony i aplikacji na serwer OVH jednym przyciskiem.
# Uruchomienie: GitHub → Actions → „Wgraj na OVH” → Run workflow.
# Dane do SFTP są w sekretach repozytorium (Settings → Secrets and variables → Actions):
#   FTP_SERVER   – ftp.cluster131.hosting.ovh.net
#   FTP_USERNAME – cafestr
#   FTP_PASSWORD – hasło SFTP (z maila od poprzedniej firmy – to samo co w FileZilli)
# Wysyłane są tylko pliki strony (index.html, img/, .htaccess) i aplikacji (panel/) do folderu www.
# Niczego na serwerze nie usuwa – tylko nadpisuje pliki nowszymi wersjami.

name: Wgraj na OVH

on:
  workflow_dispatch:

concurrency:
  group: wgraj-na-ovh
  cancel-in-progress: false

jobs:
  wgraj:
    name: Wgrywanie na cafestrychgdynia.pl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz pliki z repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź, czy są dane do SFTP
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::Brak danych SFTP. Dodaj sekrety FTP_SERVER, FTP_USERNAME i FTP_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Przygotuj pliki do wysłania
        run: |
          mkdir -p wysylka
          cp index.html .htaccess wysylka/
          cp -r img panel wysylka/
          find wysylka -type f | sort
          du -sh wysylka

      - name: Wyślij na serwer (SFTP)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          host="${S#sftp://}"; host="${host#ftp://}"; host="${host%/}"
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; \
            open --user \"$U\" --env-password sftp://$host:22; \
            mirror --reverse --verbose --no-perms --parallel=4 wysylka/ www/"

      - name: Gotowe
        run: echo "✅ Strona i aplikacja wgrane na OVH. Otwórz https://cafestrychgdynia.pl i https://cafestrychgdynia.pl/panel/"
